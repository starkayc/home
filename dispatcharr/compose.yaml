services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:0.32.0@sha256:b7d695c5cc98b9abd64c74a94539c1ebffc23d965021613c820c67e25dea41a3
    container_name: dispatcharr
    security_opt:
      - no-new-privileges:true
    cap_add:
      - SYS_NICE
    env_file: .env
    volumes:
      - ./app_data/data:/data
    networks:
      frontend_net:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dispatcharr.rule=Host(`iptv.local.example.com`)"
      - "traefik.http.routers.dispatcharr.entrypoints=https"
      - "traefik.http.routers.dispatcharr.tls=true"
      - "traefik.http.services.dispatcharr.loadbalancer.server.port=9191"

  ecm:
    image: ghcr.io/motwakorb/enhancedchannelmanager:0.18.1@sha256:2ef4645a618283264f2966b1db2ae387c9629ed254831fea4365bfec604fa0fb
    container_name: enhancedchannelmanager
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=501
      - PGID=20
      - MCP_SECRETS_DIR=/run/secrets/ecm-mcp
    volumes:
      - ./app_data/data/enhancedchannelmanager:/config
      - ./secrets/ecm:/run/secrets/ecm-mcp
    networks:
      frontend_net:
      backend_net:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.enhancedchannelmanager.rule=Host(`ecm.local.example.com`)"
      - "traefik.http.routers.enhancedchannelmanager.entrypoints=https"
      - "traefik.http.routers.enhancedchannelmanager.tls=true"
      - "traefik.http.services.enhancedchannelmanager.loadbalancer.server.port=6100"
      - "traefik.docker.network=dispatcharr_frontend_net"
