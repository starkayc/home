services:
  honcho-api:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    image: ghcr.io/plastic-labs/honcho:v3.3.0@sha256:5bb8cf7a60845e08f83fed66f01907afa0969dd1d02e414ed576102f3b12dfe8
    container_name: honcho-api
    security_opt:
      - no-new-privileges:true
    env_file: .env
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      frontend_net:
      backend_net:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.honcho.rule=Host(`honcho.local.example.com`)"
      - "traefik.http.routers.honcho.entrypoints=https"
      - "traefik.http.routers.honcho.tls=true"
      - "traefik.http.services.honcho.loadbalancer.server.port=8000"
      - "traefik.docker.network=honcho_frontend_net"
    entrypoint:
      - sh
      - docker/entrypoint.sh

  honcho-deriver:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      honcho-api:
        condition: service_healthy
      honcho-database:
        condition: service_healthy
      honcho-redis:
        condition: service_healthy
    image: ghcr.io/plastic-labs/honcho:v3.3.0@sha256:5bb8cf7a60845e08f83fed66f01907afa0969dd1d02e414ed576102f3b12dfe8
    container_name: honcho-deriver
    security_opt:
      - no-new-privileges:true
    env_file: .env
    networks:
      backend_net:
    restart: unless-stopped
    entrypoint:
      - /app/.venv/bin/python
      - -m
      - src.deriver

  honcho-database:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    image: pgvector/pgvector:pg15@sha256:47af0b65960b14f1c6945aa4ccae37836c632e9a6fe0eea9160936e616e5b2e9
    container_name: honcho-database
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_password
    env_file: .env
    command:
      - postgres
      - -c
      - max_connections=200
    volumes:
      - ./app_data/postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U honchouser -d honchodb
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
    restart: unless-stopped

  honcho-redis:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    image: redis:8.10@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    container_name: honcho-redis
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./app_data/redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
