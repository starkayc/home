services:
  minecraft:
    image: ghcr.io/itzg/minecraft-server:java25@sha256:e94acca02886fdbaad61f9c72935784ac2228a69068179f7b97ea1cac165f24e
    container_name: minecraft-server
    environment:
      - EULA=TRUE
      - TYPE=FABRIC
      - MEMORY=2048M
      - USE_AIKAR_FLAGS=true
      - TZ=America/New_York
      - DIFFICULTY=3
      - OPS=starkayc
      - UID=501
      - GID=20
    volumes:
      - ./app_data/data:/data
    ports:
      - "25565:25565"
    stdin_open: true
    tty: true
