services:
  paperless-ngx:
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    depends_on:
      paperless-ngx-postgres:
        condition: service_healthy
      paperless-ngx-valkey:
        condition: service_started
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.0@sha256:6b94799bc769a063b3340cc5847402e626d4d91d29a295a8e747f8e9bead4207
    container_name: paperless-ngx
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ./app_data/data:/usr/src/paperless/data
      - ./app_data/data/media:/usr/src/paperless/media
      - ./app_data/data/export:/usr/src/paperless/export
      - ./app_data/data/consume:/usr/src/paperless/consume
      - ./app_data/data/scripts:/usr/src/paperless/scripts
    healthcheck:
      test:
        - CMD
        - curl
        - '-fs'
        - '-S'
        - '--max-time'
        - '2'
        - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      frontend_net:
      backend_net:
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.local.example.com`)"
      - "traefik.http.routers.paperless.entrypoints=https"
      - "traefik.http.routers.paperless.tls=true"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "traefik.docker.network=paperless-ngx_frontend_net"

  paperless-ngx-valkey:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: paperless-ngx-valkey
    user: "501:20"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./app_data/valkey:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
    restart: unless-stopped

  paperless-ngx-postgres:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: paperless-ngx-postgres
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    secrets:
      - postgres_password
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=${POSTGRES_PASSWORD_FILE}
      - PGDATA=${PGDATA}
    volumes:
      - ./app_data/postgres:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 10s
    networks:
      backend_net:
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
