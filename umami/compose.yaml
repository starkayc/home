services:
  umami:
    depends_on:
      umami-db:
        condition: service_healthy
    image: ghcr.io/umami-software/umami:3.4@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    container_name: umami
    user: "1001:1001"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE}
      - APP_SECRET=${APP_SECRET}
      - DISABLE_TELEMETRY=${DISABLE_TELEMETRY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    tmpfs:
      - /tmp
      - /app/.next/cache
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl http://localhost:3000/api/heartbeat" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      frontend_net:
      backend_net:
    restart: unless-stopped

  umami-db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: umami-db
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    secrets:
      - postgres_password
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=${POSTGRES_PASSWORD_FILE}
      - PGDATA=${PGDATA}
    volumes:
      - ./app_data/database:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql
      - /tmp
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
    restart: unless-stopped

  umami-valkey:
    image: valkey/valkey:9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
    container_name: umami-valkey
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./app_data/valkey:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      backend_net:
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
