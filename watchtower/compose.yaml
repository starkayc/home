services:
  watchtower:
    image: nickfedor/watchtower:1.23.0@sha256:45b54f6dc15227cfb38dbb826f2881aa0f56aaf0c255cdbb38bd80e598bdca9a
    container_name: watchtower
    environment:
      - TZ=America/New_York
      - WATCHTOWER_SCHEDULE=0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REMOVE_VOLUMES=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=Poppy VPS
      - WATCHTOWER_NOTIFICATION_URL=pushover://shoutrrr:api@user
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
