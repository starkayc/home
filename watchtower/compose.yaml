services:
  watchtower:
    image: nickfedor/watchtower:1.22.3@sha256:2f8f2a9bd21a195b3b650409532a20f6aada8ef5834f00d0d7a999dee0779a81
    container_name: watchtower
    environment:
      - TZ=America/New_York
      - WATCHTOWER_SCHEDULE=0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REMOVE_VOLUMES=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=Leona VPS
      - WATCHTOWER_NOTIFICATION_URL=pushover://shoutrrr:api@user
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
